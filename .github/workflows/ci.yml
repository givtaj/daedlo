name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and packaged consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Node dependencies
        run: npm ci
      - name: Load the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust format and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test and build Rust contracts and independent model
        run: |
          cargo test --workspace --locked
          cargo build --workspace --locked
      - name: Check Node source, declarations and format
        run: npm run check
      - name: Test shared runtime, release contracts and archive workbench
        run: |
          npm test
          node --test tests/release-*.test.mjs
          node tests/ninja-architecture-acceptance.mjs --test-published-config
          npm run test:roots-example
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run independent browser acceptance from source
        run: |
          npm run test:e2e
          npm run test:motion
          npm run test:controls
          npm run test:cli
          npm run test:viewer
          npm run test:ninja:ui
      - name: Build an immutable candidate bundle from the clean checkout
        id: bundle
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildBundle } from './scripts/release/build.mjs';
          const result = await buildBundle({repoRoot: process.cwd(), output: 'artifacts/ci-bundle', allowDirty: false});
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest-sha256=${result.manifestSha256}\nversion=${result.manifest.version}\n`);
          NODE
      - name: Install the exact bundle and run all eight real browser groups
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest-sha256 }}
        run: node tests/release-acceptance.mjs artifacts/ci-bundle artifacts/ci-package-acceptance "$EXPECTED_MANIFEST_SHA256"
      - name: Build and verify the complete public installation kit
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest-sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { buildToolsArchive } from './scripts/release/tools.mjs';
          import { buildPublicKit } from './scripts/release/public-kit.mjs';
          const repoRoot = process.cwd();
          const tools = await buildToolsArchive({repoRoot, output: 'artifacts/ci-tools', allowDirty: false});
          await buildPublicKit({repoRoot, bundle: 'artifacts/ci-bundle', tools: 'artifacts/ci-tools', output: 'artifacts/ci-public-kit', expectedManifestSha256: process.env.EXPECTED_MANIFEST_SHA256, expectedToolsSha256: tools.sha256});
          NODE
      # Only distributable bytes are uploaded. Browser evidence and local logs stay private.
      # This is a workflow artifact, not a GitHub Release or registry publication.
      - name: Retain the verified candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daedlo-${{ steps.bundle.outputs.version }}-node${{ matrix.node }}-${{ github.sha }}
          path: |
            artifacts/ci-bundle/*
            artifacts/ci-public-kit/*
          if-no-files-found: error
          retention-days: 14

  public-metadata:
    name: Public metadata and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test repository safeguards
        run: node --test tests/public-metadata.test.mjs tests/repository-guardrails.test.mjs
      - name: Check tracked public metadata
        run: node scripts/check-public-metadata.mjs
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner
