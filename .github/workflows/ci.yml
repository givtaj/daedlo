name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source and packaged consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Node dependencies
        run: npm ci
      - name: Load the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust format and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test and build Rust contracts and independent model
        run: |
          cargo test --workspace --locked
          cargo build --workspace --locked
      - name: Check Node source, declarations and format
        run: npm run check
      - name: Test shared runtime, release contracts and archive workbench
        run: |
          npm test
          node --test tests/release-*.test.mjs
          npm run test:roots-example
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run independent browser acceptance from source
        run: npm run test:e2e
      - name: Build an immutable candidate bundle from the clean checkout
        id: bundle
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { buildBundle } from './scripts/release/build.mjs';
          const result = await buildBundle({repoRoot: process.cwd(), output: 'artifacts/ci-bundle', allowDirty: false});
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest-sha256=${result.manifestSha256}\nversion=${result.manifest.version}\n`);
          NODE
      - name: Install the exact bundle and run all eight real browser groups
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest-sha256 }}
        run: node tests/release-acceptance.mjs artifacts/ci-bundle artifacts/ci-package-acceptance "$EXPECTED_MANIFEST_SHA256"
      # Only distributable bytes are uploaded. Browser evidence and local logs stay private.
      # This is a workflow artifact, not a GitHub Release or registry publication.
      - name: Retain the verified candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-driver-${{ steps.bundle.outputs.version }}-node${{ matrix.node }}-${{ github.sha }}
          path: artifacts/ci-bundle/*
          if-no-files-found: error
          retention-days: 14
