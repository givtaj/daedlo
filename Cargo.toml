[workspace]
members = ["crates/daedlo-engine", "examples/notebook-engine"]
resolver = "2"

[workspace.package]
version = "0.1.4-alpha.4"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
